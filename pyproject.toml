[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-pipeline-orchestration"
version = "0.2.0"
description = "Airflow orchestration for a daily ETL pipeline and a weekly rollup: retries, SLAs, a custom data quality operator, and dependency-aware scheduling"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Needed only to run the DAGs in a real Airflow instance. The local
# runner (src/run_local.py) and the test suite need only pyyaml.
airflow = ["apache-airflow>=2.8"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
